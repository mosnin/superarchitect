      purpose: "Real-time network-wide resource visibility"
      inputs: ["status_broadcasts_from_all_nodes"]
      outputs: ["network_resource_map"]
    - name: "ng911_gateway"
      purpose: "Route emergency calls to appropriate sub-center"
      inputs: ["incoming_calls", "geographic_routing_data"]
      outputs: ["routed_calls"]
    - name: "shared_radio_infrastructure"
      purpose: "Interoperable communications across all agencies"
      inputs: ["radio_transmissions"]
      outputs: ["interoperable_radio_channel"]
    - name: "backup_coordination_facility"
      purpose: "Hot standby for regional hub"
      inputs: ["replicated_hub_state", "failover_trigger"]
      outputs: ["continued_hub_operations"]
    - name: "audit_compliance_system"
      purpose: "NIMS/ICS audit trail and regulatory reporting"
      inputs: ["all_coordination_events"]
      outputs: ["compliance_reports", "audit_logs"]

