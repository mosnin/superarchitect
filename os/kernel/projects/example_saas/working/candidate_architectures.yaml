# Candidate Architectures: CollabDocs Enterprise
# Generated by: Phase 03 — Architecture Search

candidates:
  - candidate_id: "cand_crdt_micro"
    thesis: "CRDT-native microservices"
    structural_bias: "distribution_first"
    summary: |
      Distributed architecture using CRDTs (Conflict-free Replicated Data Types) as the
      core data structure for document state. Each service owns a bounded context.
      CRDTs enable true offline editing and automatic conflict resolution without
      a central coordination point.

    assumptions:
      - "CRDT library exists or can be built for rich text (Yjs, Automerge)"
      - "Team can handle microservices operational complexity"
      - "WebSocket connections can be load-balanced with sticky sessions"
      - "CRDT document size remains manageable (< 50MB per document)"

    advantages:
      - "True conflict-free editing — no coordination bottleneck"
      - "Excellent offline support — CRDTs merge automatically"
      - "Horizontal scaling by document partition"
      - "No single point of failure for sync"
      - "Well-studied algorithm with production libraries (Yjs)"

    liabilities:
      - "CRDT overhead: document size grows with edit history"
      - "Microservices complexity for 8-12 person team"
      - "CRDT garbage collection is non-trivial"
      - "Rich text CRDT is harder than plain text CRDT"
      - "Debugging distributed state is difficult"

    subsystems:
      - name: "document_engine"
        purpose: "CRDT-based document state management"
        inputs: ["user_operations"]
        outputs: ["state_updates", "sync_messages"]
      - name: "sync_service"
        purpose: "WebSocket hub for real-time operation broadcast"
        inputs: ["client_operations"]
        outputs: ["merged_operations"]
      - name: "persistence_service"
        purpose: "Document storage and version history"
        inputs: ["document_snapshots"]
        outputs: ["stored_documents", "version_diffs"]
      - name: "auth_service"
        purpose: "Authentication, authorization, tenant management"
        inputs: ["credentials", "tokens"]
        outputs: ["sessions", "permissions"]
      - name: "collaboration_service"
        purpose: "Comments, mentions, presence, cursors"
        inputs: ["user_actions"]
        outputs: ["collaboration_events"]
      - name: "notification_service"
        purpose: "Email, push, in-app notifications"
        inputs: ["events"]
        outputs: ["notifications"]

    interfaces:
      - from: "client"
        to: "sync_service"
        protocol: "WebSocket"
        description: "Real-time operation streaming"
      - from: "sync_service"
        to: "document_engine"
        protocol: "gRPC"
        description: "Operation application and merge"
      - from: "document_engine"
        to: "persistence_service"
        protocol: "async/event"
        description: "Periodic snapshot persistence"
      - from: "client"
        to: "auth_service"
        protocol: "REST/HTTPS"
        description: "Authentication and token management"

    flows:
      - name: "collaborative_edit"
        steps:
          - "User types character in editor"
          - "Client generates CRDT operation"
          - "Operation sent via WebSocket to sync_service"
          - "sync_service broadcasts to other connected clients"
          - "Each client applies operation to local CRDT state"
          - "Periodically, document_engine snapshots to persistence_service"

  - candidate_id: "cand_ot_monolith"
    thesis: "OT-based modular monolith"
    structural_bias: "simplicity_first"
    summary: |
      Modular monolith using Operational Transformation (OT) for real-time editing.
      Single deployable unit with clear module boundaries. OT requires a central
      server for transformation, which simplifies consistency but creates a
      coordination bottleneck. Optimized for team velocity and operational simplicity.

    assumptions:
      - "OT server can handle 10K concurrent connections with horizontal scaling"
      - "Central coordination is acceptable for the scale target"
      - "Module boundaries can be enforced without service separation"
      - "Offline support can be achieved with OT buffering"

    advantages:
      - "Drastically simpler operations for small team"
      - "Single database, single deployment, single debugging context"
      - "Proven OT approach (Google Docs uses OT)"
      - "Faster time to market"
      - "Easier compliance audit (one system to review)"

    liabilities:
      - "OT requires central server — scaling bottleneck"
      - "Offline support is weaker (requires operation buffering and replay)"
      - "Monolith coupling risk as features grow"
      - "Harder to scale individual components independently"
      - "Migration to microservices may be costly later"

    subsystems:
      - name: "editor_module"
        purpose: "Rich text editing engine with OT"
        inputs: ["user_operations"]
        outputs: ["transformed_operations"]
      - name: "sync_module"
        purpose: "Central OT server and WebSocket management"
        inputs: ["client_operations"]
        outputs: ["transformed_broadcasts"]
      - name: "storage_module"
        purpose: "Document persistence and versioning"
        inputs: ["document_state"]
        outputs: ["stored_documents"]
      - name: "auth_module"
        purpose: "Authentication and authorization"
        inputs: ["credentials"]
        outputs: ["sessions"]
      - name: "collab_module"
        purpose: "Comments, presence, notifications"
        inputs: ["user_actions"]
        outputs: ["collaboration_events"]

    interfaces:
      - from: "client"
        to: "sync_module"
        protocol: "WebSocket"
        description: "Real-time OT operation streaming"
      - from: "sync_module"
        to: "editor_module"
        protocol: "in-process"
        description: "Direct function call within monolith"
      - from: "editor_module"
        to: "storage_module"
        protocol: "in-process"
        description: "Document persistence"

    flows:
      - name: "collaborative_edit"
        steps:
          - "User types in editor"
          - "Client sends operation via WebSocket"
          - "Central OT server transforms against concurrent operations"
          - "Transformed operation broadcast to all clients"
          - "Server applies to canonical document state"
          - "Periodic persistence to database"

  - candidate_id: "cand_hybrid_edge"
    thesis: "Hybrid edge-first with CRDT + central reconciliation"
    structural_bias: "adaptability_first"
    summary: |
      Edge-deployed CRDT nodes handle local collaboration clusters, with a central
      reconciliation service ensuring global consistency. Combines CRDT's conflict-free
      properties with centralized coordination for cross-region consistency. Optimized
      for global latency and gradual scaling.

    assumptions:
      - "Edge deployment infrastructure available (CloudFlare Workers, Fly.io)"
      - "CRDT merge across regions is eventually consistent and acceptable"
      - "Cost of edge deployment is manageable at Series A"
      - "Team can manage edge + central topology"

    advantages:
      - "Lowest latency — editing happens at the edge"
      - "Best offline support — local CRDT operates independently"
      - "Naturally multi-region from day one"
      - "Graceful degradation — edge works even if central is down"
      - "Future-proof for global scale"

    liabilities:
      - "Most complex architecture — edge + central coordination"
      - "Edge deployment adds operational overhead"
      - "Cost may be high at low scale (underutilized edge nodes)"
      - "Cross-region CRDT merge latency can be unpredictable"
      - "Hardest to debug (distributed + edge)"
      - "May be overengineered for initial market"

    subsystems:
      - name: "edge_sync_node"
        purpose: "Regional CRDT engine + WebSocket hub"
        inputs: ["local_client_operations"]
        outputs: ["local_sync_broadcasts", "cross_region_sync"]
      - name: "central_reconciliation"
        purpose: "Global state reconciliation and conflict resolution"
        inputs: ["regional_state_updates"]
        outputs: ["reconciled_state"]
      - name: "persistence_layer"
        purpose: "Durable document storage with version history"
        inputs: ["reconciled_documents"]
        outputs: ["stored_documents"]
      - name: "auth_gateway"
        purpose: "Global authentication and tenant management"
        inputs: ["credentials"]
        outputs: ["sessions", "permissions"]
      - name: "collaboration_layer"
        purpose: "Comments, presence, notifications"
        inputs: ["user_actions"]
        outputs: ["collaboration_events"]

    interfaces:
      - from: "client"
        to: "edge_sync_node"
        protocol: "WebSocket"
        description: "Low-latency local sync"
      - from: "edge_sync_node"
        to: "central_reconciliation"
        protocol: "gRPC/async"
        description: "Cross-region state sync"
      - from: "central_reconciliation"
        to: "persistence_layer"
        protocol: "async/event"
        description: "Durable storage of reconciled state"

    flows:
      - name: "collaborative_edit"
        steps:
          - "User types in editor"
          - "Client sends operation to nearest edge node"
          - "Edge node applies CRDT operation locally"
          - "Edge broadcasts to other local clients instantly"
          - "Edge periodically syncs state to central reconciliation"
          - "Central merges cross-region state"
          - "Central pushes reconciled state back to all edges"
