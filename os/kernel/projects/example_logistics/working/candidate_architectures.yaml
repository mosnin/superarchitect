# Candidate Architectures: Regional Emergency Response Network
# Generated by: Phase 03 — Architecture Search

candidates:
  - candidate_id: "cand_centralized_dispatch"
    thesis: "Single regional dispatch center replaces all 12 municipal centers"
    structural_bias: "coherence_first"
    summary: |
      All emergency calls route to a single regional dispatch center with unified
      resource visibility, unified incident classification, and unified command
      coordination. Municipal agencies retain operational authority but all dispatch
      flows through the central hub.

    assumptions:
      - "Political agreement achievable for full dispatch centralization"
      - "Single facility can be built and hardened within 18-month timeline"
      - "Staff can be consolidated and trained uniformly"
      - "Municipalities accept call transfer from local PSAPs to regional center"

    advantages:
      - "Maximum coordination coherence — single authority, no inter-hub conflicts"
      - "Lowest inter-agency communication overhead"
      - "Simplest resource visibility — single system of record"
      - "Easiest NIMS/ICS compliance — unified command structure"
      - "Most efficient staffing — no duplication across centers"

    liabilities:
      - "Single point of failure — if regional center fails, entire network fails"
      - "Political feasibility lowest — municipalities resist sovereignty loss"
      - "Geographic latency risk — calls from outlying municipalities travel further"
      - "Single facility hardening costs are highest"
      - "18-month timeline is aggressive for facility construction"

    subsystems:
      - name: "regional_dispatch_center"
        responsibility: "Unified intake, classification, and dispatch for all incident types"
        inputs: ["emergency_calls", "unit_status_updates", "incident_reports"]
        outputs: ["dispatch_orders", "resource_allocations", "incident_logs"]
      - name: "resource_tracking_system"
        responsibility: "Real-time status of all units across all 12 municipalities"
        inputs: ["unit_location_updates", "status_changes"]
        outputs: ["resource_availability_map", "unit_assignments"]
      - name: "agency_interfaces"
        responsibility: "Communication channels to each of the 12 municipal agencies"
        inputs: ["dispatch_orders"]
        outputs: ["acknowledgments", "status_updates", "resource_requests"]
      - name: "incident_command_system"
        responsibility: "ICS-compliant multi-agency incident coordination"
        inputs: ["major_incident_declaration"]
        outputs: ["command_structure", "resource_assignments", "coordination_log"]
      - name: "backup_facility"
        responsibility: "Hot standby facility for regional center failure"
        inputs: ["failover_trigger", "replicated_state"]
        outputs: ["continued_operations"]

    interfaces:
      - from: "public"
        to: "regional_dispatch_center"
        protocol: "PSAP call routing (NG911)"
        description: "All 911 calls route to regional center"
      - from: "regional_dispatch_center"
        to: "agency_interfaces"
        protocol: "CAD-to-CAD integration + radio"
        description: "Dispatch orders and resource requests"
      - from: "agency_interfaces"
        to: "resource_tracking_system"
        protocol: "Real-time AVL and status feeds"
        description: "Unit location and availability"

    flows:
      - name: "standard_dispatch"
        steps:
          - "911 call received at regional dispatch center"
          - "Dispatcher classifies incident by type and severity"
          - "System identifies nearest available appropriate units"
          - "Dispatch order issued to agency via CAD"
          - "Agency acknowledges and deploys unit"
          - "Resource tracking updated in real time"
      - name: "multi_agency_major_incident"
        steps:
          - "Major incident declared by dispatch supervisor"
          - "ICS command structure activated"
          - "Incident Commander designated per ICS protocol"
          - "Resources requested from multiple agencies"
          - "Unified coordination log opened"

  - candidate_id: "cand_hub_spoke"
    thesis: "Regional coordination hub with autonomous municipal sub-centers"
    structural_bias: "resilience_first"
    summary: |
      A regional coordination hub provides network-level visibility and multi-agency
      incident coordination, while each municipality maintains its own dispatch
      sub-center for local incidents. The hub coordinates between sub-centers for
      cross-boundary incidents. Municipalities retain local sovereignty for local calls.

    assumptions:
      - "Each sub-center can maintain full local dispatch capability independently"
      - "Hub-sub-center communication latency is acceptable for cross-boundary coordination"
      - "Political agreement achievable for hub authority over multi-agency incidents only"
      - "CAD system federation is technically feasible across 12 different legacy systems"

    advantages:
      - "No single point of failure — any sub-center can operate independently"
      - "Preserves municipal sovereignty for local incidents (political feasibility)"
      - "Geographic resilience — sub-centers serve their local area regardless of hub status"
      - "Incremental implementation — sub-centers can be federated progressively"
      - "Better political acceptance — municipalities keep local control"

    liabilities:
      - "Higher complexity — hub-sub-center coordination adds protocol layers"
      - "Resource visibility aggregation adds latency vs. centralized model"
      - "More physical infrastructure to maintain and harden (13 facilities vs. 2)"
      - "Potential for coordination gaps at hub-sub-center boundaries"
      - "More expensive to staff (12 sub-centers + hub)"

    subsystems:
      - name: "regional_coordination_hub"
        responsibility: "Network-level resource visibility, multi-agency incident coordination, cross-boundary dispatch support"
        inputs: ["sub_center_status_feeds", "multi_agency_incident_declarations", "cross_boundary_resource_requests"]
        outputs: ["coordination_directives", "resource_allocation_recommendations", "unified_incident_logs"]
      - name: "municipal_dispatch_centers"
        responsibility: "Local call intake, classification, and dispatch for local incidents"
        inputs: ["local_911_calls", "hub_directives", "unit_status_updates"]
        outputs: ["local_dispatch_orders", "status_feeds_to_hub", "cross_boundary_resource_requests"]
      - name: "federated_resource_system"
        responsibility: "Aggregated real-time resource map from all sub-center feeds"
        inputs: ["sub_center_status_feeds"]
        outputs: ["network_resource_map", "availability_queries"]
      - name: "inter_center_coordination"
        responsibility: "Protocol for cross-boundary resource requests and handoffs"
        inputs: ["resource_requests", "incident_escalations"]
        outputs: ["resource_transfer_authorizations", "handoff_confirmations"]

    interfaces:
      - from: "public"
        to: "municipal_dispatch_centers"
        protocol: "PSAP local routing (NG911)"
        description: "Calls route to local municipal center first"
      - from: "municipal_dispatch_centers"
        to: "regional_coordination_hub"
        protocol: "CAD federation protocol"
        description: "Status feeds, escalations, cross-boundary requests"
      - from: "regional_coordination_hub"
        to: "municipal_dispatch_centers"
        protocol: "Coordination directives"
        description: "Multi-agency coordination for major incidents"

    flows:
      - name: "local_incident"
        steps:
          - "911 call received at municipal sub-center"
          - "Local dispatcher classifies and dispatches"
          - "Sub-center updates hub with incident and resource status"
          - "No hub involvement unless escalation required"
      - name: "cross_boundary_incident"
        steps:
          - "Incident detected near municipal boundary"
          - "Sub-center requests cross-boundary resources via hub"
          - "Hub identifies available resources in adjacent municipality"
          - "Resource transfer authorized by receiving municipality"
          - "Deployment coordinated through hub"

  - candidate_id: "cand_distributed_peer"
    thesis: "Fully distributed peer-to-peer inter-agency coordination without a central hub"
    structural_bias: "sovereignty_first"
    summary: |
      Each municipality operates a full-capability dispatch center that communicates
      directly with peer centers for cross-boundary coordination. No central authority.
      A shared resource federation layer provides visibility without control. Coordination
      is protocol-driven rather than hierarchy-driven.

    assumptions:
      - "12 centers can maintain consistent coordination protocols without central enforcement"
      - "Protocol governance body can enforce standards across all municipalities"
      - "Peer-to-peer coordination can achieve response times comparable to hub models"
      - "Shared resource layer can aggregate data from 12 different CAD systems"

    advantages:
      - "Maximum resilience — no central failure point can affect network"
      - "Maximum political acceptability — no municipality yields authority to a hub"
      - "Naturally accommodates future municipality additions"
      - "No hub creates no geographic latency concentration"

    liabilities:
      - "Highest complexity for cross-boundary coordination (N-to-N relationships)"
      - "Protocol consistency hardest to enforce without central authority"
      - "Resource visibility requires all-to-all data sharing, which is complex"
      - "Major incident coordination requires emergent command structure — not pre-defined"
      - "NIMS/ICS compliance harder to architect without defined command hierarchy"
      - "12-way coordination for a major incident creates coordination overhead"

    subsystems:
      - name: "municipal_dispatch_nodes"
        responsibility: "Full local dispatch capability plus peer coordination capability"
        inputs: ["local_911_calls", "peer_requests", "shared_resource_feeds"]
        outputs: ["local_dispatch", "peer_notifications", "resource_status_broadcast"]
      - name: "shared_resource_federation"
        responsibility: "Aggregated read-only resource visibility layer"
        inputs: ["status_broadcasts_from_all_nodes"]
        outputs: ["network_resource_view"]
      - name: "peer_coordination_protocol"
        responsibility: "Standardized messaging protocol for cross-boundary requests, handoffs, and major incident coordination"
        inputs: ["coordination_requests"]
        outputs: ["structured_coordination_messages"]
      - name: "protocol_governance_layer"
        responsibility: "Standards body and audit function ensuring all nodes follow coordination protocols"
        inputs: ["protocol_violations", "audit_requests"]
        outputs: ["compliance_reports", "protocol_updates"]

    interfaces:
      - from: "municipal_dispatch_nodes"
        to: "municipal_dispatch_nodes"
        protocol: "Peer coordination protocol (direct)"
        description: "Cross-boundary resource requests and incident handoffs"
      - from: "municipal_dispatch_nodes"
        to: "shared_resource_federation"
        protocol: "Status broadcast"
        description: "Real-time resource availability broadcast"
