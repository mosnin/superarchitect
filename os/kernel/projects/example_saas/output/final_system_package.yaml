synthesis:
  subsystems:
    - name: "document_engine"
      purpose: "CRDT-based document state management using Yjs"
      technology: "Node.js + Yjs library"
      inputs: ["user_operations", "sync_messages"]
      outputs: ["state_updates", "snapshots"]
    - name: "sync_service"
      purpose: "WebSocket hub for real-time operation broadcast and presence"
      technology: "Node.js + ws library + Redis pub/sub"
      inputs: ["client_connections", "operations"]
      outputs: ["broadcast_operations", "presence_updates"]
    - name: "persistence_service"
      purpose: "Document storage, version history, search indexing"
      technology: "PostgreSQL + S3 (document blobs) + Elasticsearch"
      inputs: ["document_snapshots", "metadata"]
      outputs: ["stored_documents", "search_results", "version_diffs"]
    - name: "auth_service"
      purpose: "Authentication, authorization, tenant management, SSO"
      technology: "Node.js + Passport.js + PostgreSQL"
      inputs: ["credentials", "oauth_tokens", "saml_assertions"]
      outputs: ["jwt_tokens", "sessions", "permissions"]
    - name: "collaboration_service"
      purpose: "Comments, @mentions, suggestions, real-time presence"
      technology: "Node.js + PostgreSQL + Redis"
      inputs: ["user_actions", "document_context"]
      outputs: ["collaboration_events", "notifications"]
    - name: "notification_service"
      purpose: "Email, push, in-app notifications with preferences"
      technology: "Node.js + SQS + SES"
      inputs: ["events"]
      outputs: ["delivered_notifications"]
    - name: "admin_service"
      purpose: "Workspace management, billing, usage analytics"
      technology: "Node.js + PostgreSQL + Stripe"
      inputs: ["admin_actions"]
      outputs: ["workspace_config", "billing_events"]

  interfaces:
    - from: "client"
      to: "sync_service"
      protocol: "WebSocket (wss://)"
      description: "Real-time bidirectional operation and presence streaming"
    - from: "sync_service"
      to: "document_engine"
      protocol: "gRPC"
      description: "Operation application and CRDT state management"
    - from: "document_engine"
      to: "persistence_service"
      protocol: "async (SQS)"
      description: "Periodic snapshot persistence and version creation"
    - from: "client"
      to: "auth_service"
      protocol: "REST (HTTPS)"
      description: "Login, token refresh, permission checks"
    - from: "client"
      to: "collaboration_service"
      protocol: "REST + WebSocket"
      description: "Comments and presence (piggybacks on sync WebSocket)"
    - from: "collaboration_service"
      to: "notification_service"
      protocol: "async (SQS)"
      description: "Trigger notifications for mentions and replies"
    - from: "client"
      to: "admin_service"
      protocol: "REST (HTTPS)"
      description: "Workspace and billing management"

  control_points:
    - name: "rate_limit_gate"
      location: "API gateway"
      description: "Rate limiting per tenant and per user"
    - name: "auth_gate"
      location: "Every service entry point"
      description: "JWT validation + permission check"
    - name: "conflict_resolution_gate"
      location: "document_engine"
      description: "CRDT merge validation before persistence"
    - name: "tenant_isolation_gate"
      location: "persistence_service"
      description: "Row-level security enforced at database layer"

  feedback_loops:
    - name: "sync_latency_monitor"
      signal: "p95 sync latency per document"
      response: "Auto-scale sync_service replicas when > 150ms"
    - name: "conflict_rate_monitor"
      signal: "CRDT conflict frequency per document"
      response: "Alert if > 10 conflicts/minute (may indicate bug)"
    - name: "error_rate_monitor"
      signal: "5xx error rate per service"
      response: "Circuit breaker + alert at > 1% error rate"
    - name: "storage_growth_monitor"
      signal: "CRDT document size growth rate"
      response: "Trigger garbage collection when > 10MB per document"

  failure_containment:
    - failure: "sync_service crash"
      impact: "Clients disconnect, lose real-time sync"
      containment: "Auto-restart, clients auto-reconnect, local CRDT preserves state"
      recovery: "Clients resync from last known CRDT state on reconnect"
    - failure: "persistence_service unavailable"
      impact: "Documents not persisted (but still in-memory)"
      containment: "Circuit breaker, retry queue, in-memory state preserved"
      recovery: "Replay queue when persistence recovers, no data loss"
    - failure: "database failure"
      impact: "Cannot load documents or auth"
      containment: "Read replica failover, connection pool retry"
      recovery: "Automated RDS failover, 30-second RTO"
    - failure: "network partition between services"
      impact: "Async operations queued but not processed"
      containment: "SQS dead letter queue, exponential backoff retry"
      recovery: "Process backlog when partition heals"

  evolution_paths:
    - phase: "v2"
      description: "Edge deployment for global latency (adopt cand_hybrid_edge strategy)"
    - phase: "v2"
      description: "AI co-editing features (summarization, autocomplete, translation)"
    - phase: "v3"
      description: "Self-hosted enterprise deployment option"
    - phase: "v3"
      description: "Plugin/extension system for custom integrations"
    - phase: "future"
      description: "Multi-region active-active with CRDT cross-region merge"

