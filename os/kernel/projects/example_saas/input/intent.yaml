  consequence_level: "high"

intent:
  raw_request: |
    Build a real-time collaborative document editing platform for enterprise teams.
    Think Google Docs competitor with 99.9% uptime, SOC 2 compliance, and support
    for 10,000+ concurrent editors across documents. Must handle offline editing
    with conflict resolution, rich text formatting, comments, version history,
    and granular permissions per document.

  objective: |
    Design and architect a production-grade real-time collaborative document editing
    platform that achieves enterprise reliability, security compliance, and seamless
    multi-user editing at scale.

  desired_outcomes:
    - "Real-time character-by-character collaboration with sub-200ms sync latency"
    - "Offline editing with automatic conflict resolution on reconnect"
    - "Enterprise-grade security with SOC 2 Type II compliance"
    - "99.9% uptime SLA with zero data loss guarantee"
    - "Horizontal scalability to 10K+ concurrent editors"
    - "Rich text editing with embedded media, tables, and code blocks"
    - "Granular RBAC: workspace, folder, and document-level permissions"
    - "Full version history with named snapshots and diff viewing"
    - "Real-time comments, suggestions, and @mentions"
    - "Audit trail for all document operations"

  known_constraints:
    - "Must achieve SOC 2 Type II compliance within 12 months"
    - "Initial target: North America and EU regions"
    - "Budget: Series A startup (~$5M runway)"
    - "Team: 8-12 engineers"
    - "Must support web and mobile (iOS/Android)"
    - "GDPR compliance required for EU customers"

  implicit_constraints:
    - "CRDT or OT algorithm needed for conflict-free concurrent editing"
    - "WebSocket infrastructure required for real-time sync"
    - "Multi-tenant architecture needed for enterprise customers"
    - "End-to-end encryption may be required for enterprise sales"
    - "CDN/edge deployment for global latency requirements"

  ambiguity_notes:
    - "Self-hosted option vs SaaS-only: unclear — defaulting to SaaS with future self-hosted path"
    - "AI features (summarization, writing assist): not mentioned but likely competitive requirement"
    - "Integration API for third-party tools: not specified but important for enterprise"

  domain_signals:
    - "real-time collaboration"
    - "enterprise SaaS"
    - "document editing"
    - "compliance-heavy"
    - "multi-tenant"

  system_type_classification: "real_time_collaborative_saas"

